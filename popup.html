<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h3>TikTok Random Liked ❤️</h3>
        <div class="subtitle">Xem ngẫu nhiên video đã thích</div>
    </div>

    <div class="video-count" id="videoCount" title="Click để xem danh sách">0 video đã thu thập (click xem)</div>
    <div class="cache-time" id="cacheTime">Cache: Đang kiểm tra...</div>

    <div class="video-list-wrapper" id="videoListWrapper">
        <div class="empty-list">Chưa có video nào.</div>
    </div>

    <div class="btn-group">
        <button id="openPlayerBtn" class="hifi-player-btn" title="Mở Trình phát nhạc & video TikTok Hi-Fi Studio độc lập">TikTok Hi-Fi Studio 🎧✨</button>
        <button id="randomBtn">Random Video Đã Like 🎲</button>
        <div class="skip-ban-row">
            <button id="skipBtn" title="Bỏ qua video đang xem (vẫn lưu lại lần quét sau)">Bỏ qua ⏭️</button>
            <button id="banBtn" class="danger-btn" title="Xoá khỏi danh sách & cấm vĩnh viễn không thu thập nữa">Xoá vĩnh viễn 🚫</button>
        </div>
        <div class="collect-btn-row">
            <button id="quickUpdateBtn" title="Cập nhật video mới thích gần đây (tự dừng khi thấy video cũ)">Cập nhật video mới ⚡</button>
            <button id="deepAppendBtn" title="Quét tiếp lấy thêm các video đã thích cũ hơn">Quét tiếp video cũ 📜</button>
        </div>
        <button id="refreshBtn" class="secondary-btn">Thu thập lại từ đầu 🔄</button>
    </div>

    <div class="checkpoint-banner" id="checkpointBanner" style="display: none;">
        <span class="checkpoint-text" id="checkpointText">💾 Checkpoint: Đã bảo vệ 0 video</span>
    </div>

    <div class="backup-group">
        <button id="exportBtn" class="secondary-btn" title="Xuất file .json sao lưu danh sách video & danh sách cấm">Xuất Backup 📤</button>
        <button id="importBtn" class="secondary-btn" title="Nhập file .json sao lưu để nạp lại danh sách mà không cần quét">Nhập Backup 📥</button>
        <input type="file" id="importInput" accept=".json" style="display: none;">
    </div>

    <div class="setting-group">
        <div class="limit-row">
            <span class="limit-label">ID TikTok của bạn (@):</span>
            <input type="text" id="usernameInput" placeholder="@username">
        </div>
        <div class="limit-row">
            <span class="limit-label">Số lượng video cần thu thập:</span>
            <input type="number" id="limitInput" value="100" min="10" max="1000" step="10">
        </div>
    </div>

    <div class="toggle-row">
        <span class="toggle-label">
            <span class="icon">⏭️</span> Tự chuyển video
        </span>
        <label class="toggle-switch">
            <input type="checkbox" id="autoNextToggle" checked>
            <span class="toggle-slider"></span>
        </label>
    </div>

    <div class="status" id="status"></div>

    <script src="js/popup/popup-api.js"></script>
    <script src="js/popup/popup-list.js"></script>
    <script src="js/popup/popup-backup.js"></script>
    <script src="popup.js"></script>
</body>

</html>
